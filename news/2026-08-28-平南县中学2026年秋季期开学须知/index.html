    <noscript><article><h1>平南县中学2026年秋季期开学须知</h1><p><strong>·新学期·新旅程·</strong></p>
<p></p><figure class="news-image"><img src="/assets/news/2026-08-28-2026/img-01.webp" alt=""></figure>
<p></p>
<p><strong>根据《平南县中小学幼儿园二〇二六年秋季期开学通告》和上级有关部门的相关工作要求，经学校研究，我校2026年秋季期开学有关事项安排如下：</strong></p>
<h2>一、返校及注册时间</h2>
<p><strong>（一）全体高一新生注册时间：2026年8月30日上午8：00--11：00，下午14:30--16：00，全体高一新生必须按时来校。</strong></p>
<p><strong>（二）高二、高三返校时间：8月30日18:30前回到教室。</strong></p>
<p><strong>二、8月30日18：30所有学生集中本班教室上班会课，31日正式上课。</strong></p>
<h2>三、高一年级其他有关注意事项</h2>
<p><strong>（一）开学前准备。</strong></p>
<p>1.新生须准备的物品：床上用品（床的规格为195cm×90cm）、蚊帐（白色透明）、运动鞋、拖鞋、水杯、牙膏牙刷、水桶、衣架等必备的生活用品 。</p>
<p><strong>2.仪容、仪表要求：对照《平南县中学仪容仪表规范要求》整理好仪容仪表，仪容仪表合格者方可报到。</strong></p>
<p></p><figure class="news-image"><img src="/assets/news/2026-08-28-2026/img-02.webp" alt=""></figure>
<p></p>
<h3>（二）注册流程</h3>
<p><strong>1. 到八榕操场公告栏处，按照姓氏查看自己所在班级。</strong></p>
<p><strong>2. 学生凭《中考准考证》到桂花楼前相应班级处注册。</strong></p>
<p><strong>3. 学生注册后按安排好的宿舍和床位入住，并整理好个人物品。</strong></p>
<h2>四、温 馨 提 示</h2>
<p>（一）学生禁止带手机（校园内有免费公共电话）、智能手表、MP3、MP4、随身听、游戏机、电子词典等电子产品来校；不得佩戴首饰、挂件（含玉石护身符）；不看不健康读物；不进营业性网吧、游戏机房。</p>
<p>（二）严禁携带管制刀具、烟酒、打火机、蜡烛等危及安全的物品进校。</p>
<p>（三）入学时及在校学习期间不要携带太多现金（学校内有农村信用合作联社自动取款机）。</p>
<p><strong>（四）提高安全意识，注意交通安全，保护好个人财产安全，预防一切意外发生。</strong></p>
<p><strong>（五）学生如有特别病史（如不能进行剧烈运动的心脏病，以及其他在校期间需予以特别注意的病史），必须提前告知班主任。</strong></p>
<p>（六）返校前按时缴清相关费用。</p>
<p><strong>（七）送学生来校的车辆请服从交警及学校有关人员的指挥，统一有序从罗冲桥、镇小方向驶入，从江滨华府县府方向驶出，所有送学生来校车辆不得进入学校。学校安排有志愿者协助注册工作，请学生自行报到注册，家长不进入校园。</strong>&nbsp;</p>
<p>高一新生来校报到期间，如有疑问，请联系学校办公室：</p>
<p><strong>校办室：0775-7822153</strong></p>
